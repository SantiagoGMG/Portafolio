name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: GitHub gets short-lived AWS credentials, no access keys stored anywhere
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed JS/CSS/font bundles never change -> cache for a year
      - name: Upload hashed bundles
        run: |
          aws s3 sync dist/assets/ "s3://${{ vars.S3_BUCKET }}/assets/" \
            --exclude "*" --include "index-*" --include "primeicons-*" \
            --cache-control "public,max-age=31536000,immutable"

      # Everything else (images, JSON, index.html) with a short cache; --delete removes old files
      - name: Upload site
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" --delete \
            --exclude "assets/index-*" --exclude "assets/primeicons-*" \
            --cache-control "public,max-age=300"
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache"
          aws s3 cp dist/data/ "s3://${{ vars.S3_BUCKET }}/data/" --recursive \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
